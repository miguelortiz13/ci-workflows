name: Deploy Azure Container App (reutilizable)

# Despliega una imagen en una Azure Container App con OIDC (sin secretos) y
# espera a que responda sana. Uso:
#
#   jobs:
#     deploy:
#       needs: image
#       uses: miguelortiz13/github-workflows/.github/workflows/deploy-azure-container-app.yml@v0.3.0
#       permissions: { contents: read, id-token: write }
#       with:
#         app-name: ${{ vars.NEXPOS_API_APP }}
#         resource-group: ${{ vars.NEXPOS_RESOURCE_GROUP }}
#         image: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}
#         health-path: /actuator/health
#         health-expect: '"status":"UP"'
#
# Requisitos en el repo (los deja platform-governance/scripts/configurar-github.sh):
# variables AZURE_CLIENT_ID, AZURE_TENANT_ID y AZURE_SUBSCRIPTION_ID, y el
# environment indicado con su credencial federada.

on:
  workflow_call:
    inputs:
      environment:
        description: Environment de GitHub (aprobación y credencial federada).
        type: string
        default: prod
      app-name:
        type: string
        required: true
      resource-group:
        type: string
        required: true
      image:
        description: Imagen a desplegar (tag inmutable o digest).
        type: string
        required: true
      health-path:
        description: Ruta de salud. Vacía = no se verifica.
        type: string
        default: ""
      health-expect:
        description: Texto que debe contener la respuesta de salud (vacío = basta un 2xx).
        type: string
        default: ""
      health-timeout-minutes:
        description: Espera máxima. Con escala a cero y bases que se pausan, el primer arranque tarda.
        type: number
        default: 4
      jobs:
        description: Container Apps Jobs que usan la misma imagen, separados por espacios. Un nombre terminado en `?` es opcional (se omite si no existe).
        type: string
        default: ""
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Los identificadores pueden ser variables o secretos (del repo o del
      # environment): en repos públicos, como secretos no aparecen en los logs.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar
        env:
          APP: ${{ inputs.app-name }}
          RG: ${{ inputs.resource-group }}
          IMAGE: ${{ inputs.image }}
        run: |
          az containerapp update --name "$APP" --resource-group "$RG" --image "$IMAGE" --output none
          echo "Desplegada $IMAGE en $APP" >> "$GITHUB_STEP_SUMMARY"

      - name: Actualizar jobs
        if: inputs.jobs != ''
        env:
          RG: ${{ inputs.resource-group }}
          IMAGE: ${{ inputs.image }}
          JOBS: ${{ inputs.jobs }}
        run: |
          for job in $JOBS; do
            name="${job%\?}"
            if [ "$name" != "$job" ] && ! az containerapp job show -n "$name" -g "$RG" --output none 2>/dev/null; then
              echo "Job opcional $name no existe: se omite."
              continue
            fi
            az containerapp job update --name "$name" --resource-group "$RG" --image "$IMAGE" --output none
            echo "Job $name actualizado" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Verificar salud
        if: inputs.health-path != ''
        env:
          APP: ${{ inputs.app-name }}
          RG: ${{ inputs.resource-group }}
          HEALTH_PATH: ${{ inputs.health-path }}
          EXPECT: ${{ inputs.health-expect }}
          MINUTES: ${{ inputs.health-timeout-minutes }}
        run: |
          fqdn=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          # Oculta la URL en los logs (repos públicos).
          echo "::add-mask::$fqdn"
          url="https://$fqdn$HEALTH_PATH"
          deadline=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if body=$(curl -sf --max-time 30 "$url") && { [ -z "$EXPECT" ] || grep -qF -- "$EXPECT" <<<"$body"; }; then
              echo "Sana: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Esperando a $url..."
            sleep 10
          done
          echo "::error::$url no respondió sana en $MINUTES minutos"
          exit 1
