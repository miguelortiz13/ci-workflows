name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (incluye shellcheck de los run)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # Pruebas reales de los workflows reutilizables (sin publicar nada).
  container-build:
    uses: ./.github/workflows/container-build.yml
    permissions:
      contents: read
      packages: write
    with:
      image-name: github-workflows-test
      context: tests/container
      build-args: MENSAJE=hola
      push: false

  build-node:
    uses: ./.github/workflows/build-node.yml
    with:
      working-directory: tests/node
      artifact-path: dist

  build-python:
    uses: ./.github/workflows/build-python.yml
    with:
      working-directory: tests/python
      commands: |
        pip install pytest
        python -m pytest -q

  security:
    uses: ./.github/workflows/security-baseline.yml
    permissions:
      contents: read
      pull-requests: write
