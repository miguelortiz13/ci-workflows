name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (incluye shellcheck de los run)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # Prueba real del workflow de imagen, sin publicar.
  container-image:
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-name: ci-workflows-test
      context: tests/container
      build-args: MENSAJE=hola
      push: false

  security:
    uses: ./.github/workflows/security-baseline.yml
    permissions:
      contents: read
      pull-requests: write
