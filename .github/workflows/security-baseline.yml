name: Security baseline (reutilizable)

# Controles mínimos de seguridad para cualquier repo:
#   - Gitleaks: secretos en el historial (en PR, solo los commits nuevos).
#   - Dependency review: en PRs, bloquea dependencias nuevas con
#     vulnerabilidades altas o críticas (requiere repo público o GHAS).
# Uso:
#
#   jobs:
#     security:
#       uses: miguelortiz13/ci-workflows/.github/workflows/security-baseline.yml@v0.1.0
#       permissions: { contents: read, pull-requests: read }

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: Severidad mínima que bloquea en dependency review.
        type: string
        default: high

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          comment-summary-in-pr: on-failure
